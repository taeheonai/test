<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <h1>테트리스</h1>
    <div class="game-area">
      <canvas id="board" width="240" height="400"></canvas>
      <div class="side-panel">
        <div class="panel-box">
          <h2>다음 블록</h2>
          <canvas id="next" width="80" height="80"></canvas>
        </div>
        <div class="panel-box">
          <h2>점수</h2>
          <p id="score">0</p>
        </div>
        <div class="panel-box">
          <h2>레벨</h2>
          <p id="level">1</p>
        </div>
        <div class="panel-box">
          <h2>지운 줄</h2>
          <p id="lines">0</p>
        </div>
        <button id="startBtn">시작</button>
        <div id="gameOver" class="hidden">
          <p>게임 오버</p>
        </div>
      </div>
    </div>
    <div class="controls-info">
      <p>← → : 이동 | ↓ : 빠르게 내리기 | ↑ : 회전 | Space : 즉시 낙하 | P : 일시정지</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
